<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Maths Practice — Edexcel A Level</title>
    <meta name="description" content="Offline practice for Edexcel A Level Mathematics (9MA0): Pure, Statistics and Mechanics, with instant Edexcel-style marking." />
    <meta name="theme-color" content="#1D5C63" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1215" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Maths Practice" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />
    <script>
      // apply a saved light/dark choice before the first paint (src/lib/settings.tsx keeps it in sync)
      try {
        // each login on the device has its own settings (src/lib/logins.ts)
        const logins = JSON.parse(localStorage.getItem('mp.logins.v1') || 'null');
        const me = logins && logins.users.find((u) => u.id === logins.current);
        const theme = JSON.parse(localStorage.getItem((me && me.settings) || 'mp.settings.v1') || '{}').theme;
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
    <!-- the two KaTeX fonts most text uses (the paper-style serif reuses KaTeX_Main) -->
    <link rel="preload" href="/node_modules/katex/dist/fonts/KaTeX_Main-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/katex/dist/fonts/KaTeX_Math-Italic.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Maths Practice needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
