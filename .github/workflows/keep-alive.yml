name: Keep Supabase awake

# Supabase pauses free projects after a week without use (school holidays). A tiny daily call keeps
# the online logins ready. Does nothing until supabase/setup.sh has set the repository variables.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.SUPABASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping
        run: curl -fsS -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/ping" -H "apikey: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}" -H "content-type: application/json" -d '{}'
