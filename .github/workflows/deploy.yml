name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Template registry is up to date
        run: npm run gen && git diff --exit-code -- src/content/templates
      - name: Type check
        run: npm run typecheck
      - name: Unit, marking and template tests (≥ 200 seeds per template)
        run: npm test
      - name: Bank index is fresh (every listed seed re-validated)
        run: npm run bank:check
      - name: Coverage gate (≥ 3 templates per spec point)
        run: npm run coverage -- $COVERAGE_FLAGS
        env:
          COVERAGE_FLAGS: ${{ vars.COVERAGE_FLAGS }}
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end tests (phone, tablet, desktop)
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
