name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Template registry is up to date
        run: npm run gen && git diff --exit-code -- src/content/templates
      - name: Type check
        run: npm run typecheck
      - name: Unit, marking and template tests (≥ 200 seeds per template)
        run: npm test
      - name: Bank index is fresh (every listed seed re-validated)
        run: npm run bank:check
      - name: Coverage gate (≥ 3 templates per spec point)
        run: npm run coverage -- $COVERAGE_FLAGS
        env:
          COVERAGE_FLAGS: ${{ vars.COVERAGE_FLAGS }}
      - name: Build (tested as is: logins on each device)
        run: npm run build
      - name: Build a copy with pretend Supabase settings (for the online-login tests)
        run: npm run build:cloud-test
      - name: Build the site to publish (online logins once supabase/setup.sh has set the variables)
        run: npx vite build --outDir dist-site
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist
            dist-cloud
          retention-days: 3
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-site

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # browsers and their system libraries come preinstalled (no slow apt mirror); keep in step with @playwright/test
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: .
      - name: End-to-end tests (phone, tablet, desktop)
        run: npx playwright test
        env:
          HOME: /root
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    needs: [checks, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
