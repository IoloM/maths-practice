# Cloudflare Worker for Maths Practice. Secrets (never in this file):
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put ACCESS_CODE
name = "maths-practice-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "https://iolom.github.io,http://localhost:5173,http://localhost:4173,http://localhost:5811"
DAILY_AI_LIMIT = "200"

[[d1_databases]]
binding = "DB"
database_name = "maths-practice"
database_id = "REPLACED_BY_SETUP_SCRIPT"
